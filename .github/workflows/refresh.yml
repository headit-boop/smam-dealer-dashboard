name: refresh-dashboard

on:
  schedule:
    - cron: "*/30 * * * *"      # every 30 minutes
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pandas openpyxl

      - name: Pull every tab from the Google Sheet
        run: python fetch_sheet.py

      - name: Work out the numbers
        run: python compute.py

      - name: Rebuild index.html
        run: python render.py

      - name: Commit the refreshed dashboard
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --quiet --cached; then
            echo "dashboard unchanged"
          else
            git commit -m "refresh dashboard $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
